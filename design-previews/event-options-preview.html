:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h3,
h4,
h5,
h6 {

  line-height: 1.3;
}

b,
strong,
th {

}

.table-responsive {

  overflow-x: auto;

}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {

}

}

}

.table .text-nowrap {

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );

    var(--tooltip-available-height, calc(100vh - 10px)),

  border-radius: var(--radius-lg);

  color: var(--popover-foreground);
  background: var(--popover);

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;

  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.text-muted {

}

.tabular-nums {

}

.sr-only {

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  gap: 2px 12px;
  margin-bottom: 0;

  grid-column: 1 / -1;

.btn,
.form-check-input,

}

.btn {
  appearance: button;

  min-height: 28px;

a.btn {

.btn:not(:disabled):hover {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

  opacity: 0.4;

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {

    min-height: 44px;
  }

  .form-control,
  .form-select {

  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],

    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

#widget &gt; svg {

svg.lucide {

}

.text-destructive {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;codexbar-event-options&#x27;);
      const names = {A:&#x27;连续时间线&#x27;,B:&#x27;当前重点&#x27;,C:&#x27;阶段路线&#x27;,D:&#x27;进展播报&#x27;};
      const glyphs = {
        book:&#x27;&lt;path d=&quot;M2 3h5c2 0 3 1 3 2v12c0-1-1-2-3-2H2zM18 3h-5c-2 0-3 1-3 2v12c0-1 1-2 3-2h5z&quot;/&gt;&#x27;,
        pencil:&#x27;&lt;path d=&quot;m3 13 10-10 4 4L7 17l-5 1zM11 5l4 4&quot;/&gt;&#x27;,
        terminal:&#x27;&lt;rect x=&quot;2&quot; y=&quot;3&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;3&quot;/&gt;&lt;path d=&quot;m5 7 3 3-3 3m6 0h4&quot;/&gt;&#x27;,
        triangle:&#x27;&lt;path d=&quot;m10 2 9 16H1zM10 7v5m0 2v1&quot;/&gt;&#x27;,
        circle:&#x27;&lt;circle cx=&quot;10&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;currentColor&quot; stroke=&quot;none&quot;/&gt;&#x27;,
        check:&#x27;&lt;path d=&quot;m4 10 4 4 8-9&quot;/&gt;&#x27;,
        layers:&#x27;&lt;path d=&quot;m10 2 8 4-8 4-8-4zm-8 9 8 4 8-4m-16 5 8 4 8-4&quot;/&gt;&#x27;
      };
      const icon = name =&gt; &#x27;&lt;svg viewBox=&quot;0 0 20 20&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&#x27;+glyphs[name]+&#x27;&lt;/svg&gt;&#x27;;

      const states = {
        running:{label:&#x27;执行中&#x27;,glyph:&#x27;circle&#x27;,focus:&#x27;验证审批恢复&#x27;,sub:&#x27;当前阶段&#x27;,recent:&#x27;发起 Swift 测试命令&#x27;,action:&#x27;查看会话 ↗&#x27;},

        const rows = [[&#x27;book&#x27;,&#x27;读取状态处理逻辑&#x27;,&#x27;3分前&#x27;],[&#x27;pencil&#x27;,&#x27;修改状态同步实现&#x27;,&#x27;1分前&#x27;]];

        if(key === &#x27;resumed&#x27;) rows.push([&#x27;triangle&#x27;,&#x27;曾等待审批处理&#x27;,&#x27;稍早&#x27;],[&#x27;circle&#x27;,&#x27;已恢复执行，继续验证&#x27;,&#x27;刚刚&#x27;]);

        root.querySelector(&#x27;[data-panel=&quot;b&quot;]&#x27;).innerHTML = &#x27;&lt;div class=&quot;cb-focus&quot;&gt;&lt;div class=&quot;cb-eyebrow&quot;&gt;&#x27;+state.sub+&#x27;&lt;/div&gt;&lt;div class=&quot;cb-primary&quot;&gt;&#x27;+state.focus+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cb-context&quot;&gt;&lt;span&gt;已做&lt;/span&gt;&lt;span&gt;接入状态通知&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cb-context&quot;&gt;&lt;span&gt;后续&lt;/span&gt;&lt;span&gt;检查重启后的状态恢复&lt;/span&gt;&lt;/div&gt;&#x27;+evidence(key===&#x27;waiting&#x27;?&#x27;triangle&#x27;:key===&#x27;resumed&#x27;?&#x27;circle&#x27;:&#x27;terminal&#x27;,state.recent);
        root.querySelector(&#x27;[data-panel=&quot;c&quot;]&#x27;).innerHTML = &#x27;&lt;div class=&quot;cb-route&quot;&gt;&#x27;+[&#x27;定位&#x27;,&#x27;接入&#x27;,&#x27;验证&#x27;,&#x27;重启&#x27;].map((label,i)=&gt;&#x27;&lt;div class=&quot;cb-route-step &#x27;+(i&lt;2?&#x27;is-done&#x27;:i===2?&#x27;is-active&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span class=&quot;cb-route-marker&quot;&gt;&#x27;+(i&lt;2?&#x27;✓&#x27;:i===2?(key===&#x27;waiting&#x27;?&#x27;!&#x27;:&#x27;3&#x27;):&#x27;4&#x27;)+&#x27;&lt;/span&gt;&lt;span&gt;&#x27;+label+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;cb-route-title&quot;&gt;验证审批恢复&lt;/div&gt;&#x27;+ (key===&#x27;waiting&#x27;?&#x27;&lt;div class=&quot;cb-focus&quot;&gt;&lt;div class=&quot;cb-primary&quot;&gt;待处理请求&lt;/div&gt;&lt;div class=&quot;cb-subtle&quot;&gt;当前阶段保持在这里&lt;/div&gt;&lt;/div&gt;&#x27;:evidence(key===&#x27;resumed&#x27;?&#x27;circle&#x27;:&#x27;terminal&#x27;,state.recent))+&#x27;&lt;div class=&quot;cb-progress-label&quot;&gt;下一阶段：检查重启场景&lt;/div&gt;&#x27;;
        const stories = {
          running:&#x27;状态通知接入步骤已完成。&lt;strong&gt;现在验证审批恢复&lt;/strong&gt;，随后检查重启场景。&#x27;,
          waiting:&#x27;状态通知接入步骤已完成。验证过程中出现&lt;strong&gt;待处理审批&lt;/strong&gt;，需要你返回会话处理。&#x27;,
          resumed:&#x27;待处理标记已清除，&lt;strong&gt;继续验证审批恢复&lt;/strong&gt;。后续仍是检查重启场景。&#x27;
        };
        const previous = key===&#x27;resumed&#x27;?&#x27;验证中出现待处理审批&#x27;:key===&#x27;waiting&#x27;?&#x27;开始验证审批恢复&#x27;:&#x27;进入状态通知接入步骤&#x27;;
        root.querySelector(&#x27;[data-panel=&quot;d&quot;]&#x27;).innerHTML = &#x27;&lt;div class=&quot;cb-story&quot;&gt;&lt;div class=&quot;cb-eyebrow&quot;&gt;最新进展&lt;/div&gt;&lt;p class=&quot;cb-story-text&quot;&gt;&#x27;+stories[key]+&#x27;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cb-story-before&quot;&gt;上一条 · &#x27;+previous+&#x27;&lt;/div&gt;&#x27;+evidence(key===&#x27;waiting&#x27;?&#x27;triangle&#x27;:key===&#x27;resumed&#x27;?&#x27;circle&#x27;:&#x27;terminal&#x27;,state.recent);
        root.querySelector(&#x27;[data-announcement]&#x27;).textContent = &#x27;示例切换为&#x27;+state.label+&#x27;，四种方案已同步更新。&#x27;;
      }
      root.querySelectorAll(&#x27;.cb-state-button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,()=&gt;render(button.dataset.state)));
      root.querySelectorAll(&#x27;.cb-choose&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,async()=&gt;{
        const choice = button.dataset.choice;
        root.querySelectorAll(&#x27;.cb-choose&#x27;).forEach(item=&gt;item.setAttribute(&#x27;aria-pressed&#x27;,String(item===button)));
        const output = root.querySelector(&#x27;[data-selection]&#x27;);
        output.textContent = &#x27;已选 &#x27;+choice+&#x27; · &#x27;+names[choice];
        if(typeof window.openai?.sendFollowUpMessage === &#x27;function&#x27;) {
          try { await window.openai.sendFollowUpMessage({prompt:&#x27;我选择缩略图事件动态方案 &#x27;+choice+&#x27;：&#x27;+names[choice]+&#x27;。请按这个方向调整。&#x27;,title:&#x27;选择方案 &#x27;+choice}); }
          catch { output.textContent = &#x27;已选 &#x27;+choice+&#x27; · &#x27;+names[choice]+&#x27;；也可以在对话中回复这个编号。&#x27;; }
        }
      }));
      render(&#x27;running&#x27;);
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

})();
