<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" fill="none" role="img" aria-labelledby="title description">
  <title id="title">CodexBar — Keep the vibe. Keep the context.</title>
  <desc id="description">深蓝色产品主视觉。少切窗口，多看进展。右侧悬浮条示意展示三个虚构项目：Orbit 正在执行、Canvas 等待处理、Launchpad 可查看回复。</desc>
  <defs>
    <linearGradient id="background" x1="56" y1="0" x2="1180" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101727"/>
      <stop offset=".54" stop-color="#101529"/>
      <stop offset="1" stop-color="#191A38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(922 239) rotate(90) scale(322 382)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7673F6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7673F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="76" y1="63" x2="119" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B5B0FF"/>
      <stop offset="1" stop-color="#8179F5"/>
    </linearGradient>
    <linearGradient id="glass" x1="699" y1="135" x2="1075" y2="387" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36374D" stop-opacity=".94"/>
      <stop offset="1" stop-color="#25263C" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="edge" x1="717" y1="144" x2="1085" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".36"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#B8BCF5" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="650" y="116" width="480" height="312" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="20" stdDeviation="18" flood-color="#070916" flood-opacity=".4"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="510" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="510" fill="url(#background)"/>
    <rect x="600" width="600" height="510" fill="url(#grid)"/>
    <rect width="1200" height="510" fill="url(#glow)"/>
    <circle cx="915" cy="257" r="225" stroke="#AEAAEF" stroke-opacity=".09"/>
    <circle cx="915" cy="257" r="177" stroke="#AEAAEF" stroke-opacity=".06"/>
    <path d="M625 422C794 422 791 69 1135 69" stroke="#ADA7FA" stroke-opacity=".15"/>
    <circle cx="1135" cy="69" r="3" fill="#B6AFFF" fill-opacity=".65"/>
    <circle cx="696" cy="130" r="3" fill="#B6AFFF" fill-opacity=".4"/>
    <path d="M1129 402V414M1123 408H1135" stroke="#B6AFFF" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="72" y="63" width="49" height="49" rx="14" fill="url(#mark)"/>
      <path d="M87 83H106M87 92H101M87 101H96" stroke="#17182F" stroke-width="4" stroke-linecap="round"/>
      <text x="138" y="98" fill="#F7F7FD" font-size="33" font-weight="650" letter-spacing="-.8">CodexBar</text>

      <text x="72" y="193" fill="#F6F6FC" font-size="49" font-weight="650" letter-spacing="-1.8">Keep the vibe.</text>
      <text x="72" y="255" fill="#B9B4FF" font-size="49" font-weight="650" letter-spacing="-1.8">Keep the context.</text>
      <text x="73" y="315" fill="#BDC3D5" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" letter-spacing="1">少切窗口，多看进展。</text>

      <path d="M73 377H109" stroke="#78759E" stroke-width="2"/>
      <text x="122" y="383" fill="#9CA5BE" font-size="17" letter-spacing=".2">Your Codex flow, at a glance.</text>
      <text x="73" y="460" fill="#7D89A5" font-size="13" font-weight="500" letter-spacing="2">NATIVE macOS  /  BUILT FOR VIBE CODING</text>

      <g filter="url(#shadow)">
        <rect x="696" y="142" width="390" height="226" rx="20" fill="url(#glass)"/>
        <rect x="696.5" y="142.5" width="389" height="225" rx="19.5" stroke="url(#edge)"/>
      </g>
      <rect x="710" y="188" width="362" height="53" rx="10" fill="#FFFFFF" fill-opacity=".035"/>
      <path d="M715 187H1067" stroke="#FFFFFF" stroke-opacity=".085"/>
      <g stroke="#BFC4D6" stroke-width="1.7" stroke-linecap="round">
        <path d="M722 159V174M727 161V174M732 157L735 173M721 175H736"/>
      </g>
      <circle cx="741" cy="158" r="3" fill="#AAA2FF"/>
      <text x="752" y="171" fill="#D5D8E5" font-size="14" font-weight="550">CodexBar</text>
      <path d="M1051 163H1065M1051 168H1065M1051 173H1065" stroke="#A7AEC3" stroke-width="1.5" stroke-linecap="round"/>

      <circle cx="733" cy="214" r="8" stroke="#7770BD" stroke-width="2.3"/>
      <path d="M733 206A8 8 0 0 1 740.5 216.8" stroke="#C7C1FF" stroke-width="2.3" stroke-linecap="round"/>
      <text x="755" y="221" fill="#F4F3FB" font-size="20" font-weight="550">Orbit</text>
      <rect x="970" y="200" width="86" height="27" rx="13.5" fill="#A99AFB" fill-opacity=".12"/>
      <text x="1013" y="218" fill="#C9C3FF" font-size="13" text-anchor="middle">Running</text>

      <circle cx="733" cy="271" r="8" fill="#E7BA6F" fill-opacity=".16"/>
      <path d="M733 266V272M733 275V275.1" stroke="#EDC483" stroke-width="2.3" stroke-linecap="round"/>
      <text x="755" y="278" fill="#F4F3FB" font-size="20" font-weight="550">Canvas</text>
      <rect x="970" y="257" width="86" height="27" rx="13.5" fill="#E5B366" fill-opacity=".1"/>
      <text x="1013" y="275" fill="#E5C38F" font-size="13" text-anchor="middle">Needs you</text>

      <circle cx="733" cy="328" r="8" fill="#79D8B0" fill-opacity=".13"/>
      <path d="M729 328L732 331L737 325" stroke="#8BDAB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="755" y="335" fill="#F4F3FB" font-size="20" font-weight="550">Launchpad</text>
      <rect x="970" y="314" width="86" height="27" rx="13.5" fill="#77D3AA" fill-opacity=".1"/>
      <text x="1013" y="332" fill="#9ADDBC" font-size="13" text-anchor="middle">Ready</text>

      <text x="891" y="414" fill="#9BA4C1" font-size="15" text-anchor="middle" letter-spacing=".3">Three projects. One quiet companion.</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="509" rx="23.5" stroke="#D0D3FF" stroke-opacity=".1"/>
  </g>
</svg>
